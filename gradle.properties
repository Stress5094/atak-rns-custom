org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# No org.gradle.java.home here on purpose: it takes an absolute path, which is
# only ever correct on one machine. AGP 8.x needs JDK 17+ to run (not just to
# target), and gradle/gradle-daemon-jvm.properties asks for 21 -- Gradle finds
# a matching JDK or downloads one, on whatever machine this is built on.
